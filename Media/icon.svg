<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gamepad Camera Offset: a tauren with a cape, seen from behind, off to the side; the game's white dot ahead.
       Palette as Alt Courier's icon: navy, teal, pastel pink and yellow, and pastel tan for the horns. -->
  <rect x="0" y="0" width="512" height="512" fill="#15202E"/>

  <!-- the cape, falling from the shoulders past the bottom edge, with its folds -->
  <path d="M 52 384 C 52 352 108 344 150 344 C 192 344 248 352 248 384 L 274 512 L 26 512 Z" fill="#F4A7B9"/>
  <g fill="none" stroke="#E58BA3" stroke-width="8" stroke-linecap="round">
    <path d="M 104 396 Q 94 456 84 512"/>
    <path d="M 150 400 L 150 512"/>
    <path d="M 196 396 Q 206 456 216 512"/>
  </g>

  <!-- the shoulders: broad metal plates, only a little rounded, each with a seam and a shine; teal skin at the neck -->
  <rect x="92" y="336" width="116" height="56" rx="24" fill="#5BE0C8"/>
  <g fill="#AFC0D2">
    <rect x="4" y="354" width="98" height="72" rx="20" transform="rotate(-6 53 390)"/>
    <rect x="198" y="354" width="98" height="72" rx="20" transform="rotate(6 247 390)"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M 24 396 Q 54 404 84 392" stroke="#7B90A6" stroke-width="5"/>
    <path d="M 276 396 Q 246 404 216 392" stroke="#7B90A6" stroke-width="5"/>
    <path d="M 22 374 Q 46 364 76 366" stroke="#DCE6F0" stroke-width="7"/>
    <path d="M 278 374 Q 254 364 224 366" stroke="#DCE6F0" stroke-width="7"/>
  </g>
  <!-- the cape's cord and clasp -->
  <path d="M 100 380 Q 150 400 200 380" fill="none" stroke="#F6D98B" stroke-width="10" stroke-linecap="round"/>
  <circle cx="150" cy="394" r="11" fill="#F6D98B"/>

  <!-- the braid down the back, in front of the cape's cord, tied with yellow -->
  <g fill="#B58E6C">
    <ellipse cx="150" cy="372" rx="17" ry="17"/><ellipse cx="150" cy="402" rx="16" ry="17"/>
    <ellipse cx="150" cy="432" rx="15" ry="16"/><ellipse cx="150" cy="460" rx="14" ry="15"/>
  </g>
  <path d="M 138 417 Q 150 424 162 417 M 138 447 Q 150 454 162 447" fill="none" stroke="#8A6548" stroke-width="5" stroke-linecap="round"/>
  <circle cx="150" cy="486" r="9" fill="#F6D98B"/>

  <!-- ears: smaller, softly rounded, by the horns, sticking out sideways; from behind it's their back that shows, so just a fold line -->
  <g fill="#5BE0C8">
    <path d="M 98 302 C 80 290 58 286 42 292 Q 30 297 37 306 C 53 320 74 331 100 333 Z"/>
    <path d="M 202 302 C 220 290 242 286 258 292 Q 270 297 263 306 C 247 320 226 331 200 333 Z"/>
  </g>
  <g fill="none" stroke="#15202E" stroke-width="5" stroke-linecap="round">
    <path d="M 90 318 Q 68 309 52 300"/>
    <path d="M 210 318 Q 232 309 248 300"/>
  </g>

  <!-- horns, curving out and up to a sharp point, with their rings -->
  <g fill="#D9B48F">
    <path d="M 100 278 C 48 282 20 236 36 168 C 46 222 76 240 118 246 Z"/>
    <path d="M 200 278 C 252 282 280 236 264 168 C 254 222 224 240 182 246 Z"/>
  </g>
  <g fill="none" stroke="#15202E" stroke-width="5" stroke-linecap="round">
    <path d="M 70 276 L 80 246"/><path d="M 36 232 L 52 216"/>
    <path d="M 230 276 L 220 246"/><path d="M 264 232 L 248 216"/>
  </g>

  <!-- the head, big and round -->
  <ellipse cx="150" cy="296" rx="68" ry="60" fill="#5BE0C8"/>

  <!-- the hair: one piece, from the top of the head down the back of the neck into the braid -->
  <path d="M 92 286 C 86 206 214 206 208 286 C 204 314 184 338 170 362 L 130 362 C 116 338 96 314 92 286 Z" fill="#B58E6C"/>
  <path d="M 124 232 Q 134 280 138 340 M 150 224 Q 152 290 150 352 M 176 232 Q 166 280 162 340" fill="none" stroke="#8A6548" stroke-width="5" stroke-linecap="round"/>

  <!-- the reticle: the game's white dot (half this radius, 15, in icon-400.png for CurseForge: full size looked like a moon there) -->
  <circle cx="392" cy="196" r="30" fill="#FFFFFF"/>
</svg>
